# Reusable container image build (WI-3087), BuildKit with a registry cache.
#
#   image:
#     uses: TheDancingDeveloper-org/github-policy/.github/workflows/image.yml@v1.0.0
#     with: {image: ghcr.io/thedancingdeveloper-org/egressy, push: "${{ github.event_name == 'push' }}"}
#     permissions: {contents: read, packages: write}
#
# - Layers come from `<image>-cache:<target>-main`, written only on the
#   default branch, so merge-queue and PR builds reuse it and never rebuild
#   from scratch (CI review §3.5). Those builds never write the cache.
# - `push: false` (PR / merge_group) builds and loads only. `push: true` is
#   for push to main, tags or dispatch, on a `publish` runner (rule CI-06).
# - Private dependencies go in as BuildKit secrets (`secret-env`), never
#   build args (rule CI-23).
# - `remote-buildkit` points buildx at the shared in-cluster buildkitd when
#   it exists (phase 2); empty uses the runner's docker driver.

name: Image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. ghcr.io/thedancingdeveloper-org/egressy.
        type: string
        required: true
      context:
        type: string
        default: .
      file:
        type: string
        default: Dockerfile
      target:
        description: Dockerfile target; also the cache key.
        type: string
        default: ""
      push:
        description: Push by digest (main, tags, dispatch only).
        type: boolean
        default: false
      tags:
        description: Newline-separated tags to apply when pushing.
        type: string
        default: ""
      runs-on:
        description: JSON runs-on. docker for builds, publish when push is true.
        type: string
        default: '["self-hosted", "docker"]'
      remote-buildkit:
        description: tcp:// address of a shared buildkitd (optional).
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 45
    secrets:
      build-secrets:
        description: Newline-separated id=value pairs passed as BuildKit secrets.
        required: false
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    name: image
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ inputs.remote-buildkit != '' && 'remote' || 'docker-container' }}
          endpoint: ${{ inputs.remote-buildkit }}

      - name: Log in to GHCR
        if: ${{ startsWith(inputs.image, 'ghcr.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Cache refs
        id: cache
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          TARGET: ${{ inputs.target }}
          IS_MAIN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          ref="${IMAGE}-cache:${TARGET:-default}-main"
          echo "from=type=registry,ref=${ref}" >> "$GITHUB_OUTPUT"
          if [ "$IS_MAIN" = "true" ]; then
            echo "to=type=registry,ref=${ref},mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "to=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ inputs.push && inputs.tags || format('{0}:ci-{1}', inputs.image, github.run_id) }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          secrets: ${{ secrets.build-secrets }}
          provenance: false
