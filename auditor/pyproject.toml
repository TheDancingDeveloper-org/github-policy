[project]
name = "ci-auditor"
version = "1.0.0"
description = "CI guardrails auditor and policy gate for TheDancingDeveloper-org (WI-3087)"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
ci-auditor = "ci_auditor.__main__:main"

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.18.2", "ruff==0.14.0", "types-PyYAML==6.0.12.20250915"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_auditor"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; metric f-strings stay on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
