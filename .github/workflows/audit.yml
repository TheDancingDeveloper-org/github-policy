name: Organization workflow policy audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, node-b, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Audit workflow runner policy and exceptions
        run: scripts/audit-workflows.sh .
